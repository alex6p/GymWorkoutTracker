name: Weekly automated strength plan

on:
  workflow_dispatch:
    inputs:
      plan_week:
        description: "Optional Monday date (YYYY-MM-DD); blank uses next Monday in America/New_York"
        required: false
        type: string
  schedule:
    # Sunday evening Eastern: 8:30 PM during daylight time, 7:30 PM standard time.
    - cron: "30 0 * * 1"

permissions:
  contents: write

concurrency:
  group: weekly-strength-plan
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      PLAN_WEEK: ${{ inputs.plan_week }}
    steps:
      - name: Check out the GitHub Pages repository
        uses: actions/checkout@v5

      - name: Generate and validate next week's plan
        run: node scripts/generate-weekly-plan.mjs

      - name: Publish the plan when it changed
        shell: bash
        run: |
          if git diff --quiet -- data/current-plan.json; then
            echo "No plan change to publish."
            exit 0
          fi
          git config user.name "lift-log-plan-bot"
          git config user.email "lift-log-plan-bot@users.noreply.github.com"
          git add data/current-plan.json
          git commit -m "Publish automated weekly strength plan"
          git push
