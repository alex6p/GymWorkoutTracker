<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Lift Log</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#101214" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <header class="topbar">
    <button id="menuBtn" class="hamburger-btn" aria-label="Menu" title="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="titlewrap">
      <div id="routeLabel" class="subbrand">Routines</div>
    </div>
    <div id="headerPill" class="pill hidden">Active</div>
  </header>

  <aside id="drawer" class="drawer hidden" aria-hidden="true">
    <div id="drawerBackdrop" class="drawer-backdrop"></div>
    <div class="drawer-panel">
      <div class="drawer-head">
        <div>
          <div class="drawer-title">Lift Log</div>
        </div>
        <button id="drawerClose" class="iconbtn" aria-label="Close">Close</button>
      </div>
      <nav class="drawer-nav">
        <button class="navitem is-active" data-route="workouts">Routines</button>
        <button class="navitem" data-route="history">History</button>
        <button class="navitem" data-route="settings">Settings</button>
      </nav>
    </div>
  </aside>

  <main class="container">
    <section id="timerBar" class="timerbar hidden" aria-live="polite">
      <div class="timerbar-row">
        <div>
          <div class="timer-title">Rest Timer</div>
          <div id="timerSub" class="timer-sub">Ready for the next set</div>
        </div>
        <div class="timer-right">
          <div id="timerCountdown" class="timer-countdown">0:00</div>
          <button id="timerMinus" class="iconbtn" title="Remove 15 seconds">-15</button>
          <button id="timerPlus" class="iconbtn" title="Add 30 seconds">+30</button>
          <button id="timerStop" class="iconbtn" title="Stop">Stop</button>
        </div>
      </div>
      <div class="progress"><div id="timerProgress" class="progress-bar"></div></div>
    </section>

    <section id="route-workouts" class="route">
      <section id="activeWorkout" class="active-shell hidden"></section>
      <div id="workoutsRoot"></div>
    </section>

    <section id="route-history" class="route hidden">
      <div id="historyRoot"></div>
    </section>

    <section id="route-settings" class="route hidden">
      <div class="section-block">
        <div class="section-head">
          <div>
            <h2>Settings</h2>
            <p>Keep the tracker tuned to how you lift.</p>
          </div>
        </div>
        <div class="settings-list">
          <label class="setting-row">
            <span>
              <strong>Units</strong>
              <small>Turn on for kg. Leave off for lb.</small>
            </span>
            <input id="unitsToggle" type="checkbox" />
          </label>
          <label class="setting-row">
            <span>
              <strong>Auto-start rest timer</strong>
              <small>Start the timer after a set is completed.</small>
            </span>
            <input id="autoRestToggle" type="checkbox" />
          </label>
          <label class="setting-row">
            <span>
              <strong>Blank weight uses last weight</strong>
              <small>Fast logging when your working weight stays the same.</small>
            </span>
            <input id="blankWeightUsesBaselineToggle" type="checkbox" />
          </label>
        </div>
      </div>

      <div class="section-block">
        <div class="section-head">
          <div>
            <h2>Custom Exercises</h2>
            <p>Exercises you added to the library.</p>
          </div>
          <button id="newExerciseBtn" class="btn secondary">New</button>
        </div>
        <div id="customExercisesList" class="list"></div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div id="modalBackdrop" class="modal-backdrop"></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
